<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 76" width="224" height="76" fill="none">
  <style>
    .text-top {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.2px;
      fill: #52525B;
    }
    .text-bottom {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.4px;
      fill: #0A0A0A;
    }
    @media (prefers-color-scheme: dark) {
      .text-top {
        fill: #A1A1AA;
      }
      .text-bottom {
        fill: #FFFFFF;
      }
    }
  </style>

  <!-- LUBUS Brand Squircle Tile -->
  <rect x="0" y="0" width="76" height="76" rx="16" fill="#0052FF"/>

  <!-- Package & Download Icon -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Package Body -->
    <path d="M 21 34 V 51 C 21 54.5 23.5 57 27 57 H 49 C 52.5 57 55 54.5 55 51 V 34"/>
    <!-- Open Flaps -->
    <path d="M 17 34 L 26 34 L 32 25"/>
    <path d="M 59 34 L 50 34 L 44 25"/>
    <!-- Download Arrow -->
    <path d="M 38 18 V 43"/>
    <path d="M 30 35 L 38 43 L 46 35"/>
  </g>

  <!-- Wordmark stacked: Composer on top, EDD Plugin below -->
  <text x="90" y="30" class="text-top">Composer</text>
  <text x="90" y="59" class="text-bottom">EDD Plugin</text>
</svg>
